<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso Financeiro</title>
    <!-- Configuração PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845724.png">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDKs do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 pb-20">

    <!-- Tela de Autenticação / Login -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-5 text-center">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Sucesso Financeiro</h2>
                <p class="text-xs text-slate-500 mt-1">Acesse sua conta para continuar</p>
            </div>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">E-mail</label>
                    <input type="email" id="authEmail" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">Senha</label>
                    <input type="password" id="authPassword" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
                </div>
            </div>

            <p id="authError" class="text-xs text-rose-500 hidden font-medium"></p>

            <div class="space-y-2">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg transition">Entrar</button>
                <button onclick="handleSignUp()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-sm transition">Criar Nova Conta</button>
            </div>
        </div>
    </div>

    <!-- Interface Principal do Aplicativo -->
    <div id="appScreen" class="hidden">
        <!-- Topo / Cabeçalho -->
        <header class="bg-indigo-600 text-white p-5 rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center max-w-md mx-auto">
                <div>
                    <h1 class="text-lg font-bold">Finanças do Casal</h1>
                    <p id="userEmailDisplay" class="text-xs text-indigo-200"></p>
                </div>
                <button onclick="handleLogout()" title="Sair da conta" class="w-9 h-9 bg-indigo-500 hover:bg-indigo-700 rounded-xl flex items-center justify-center transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
            
            <!-- Resumo Financeiro -->
            <div class="mt-6 bg-white/10 backdrop-blur-md rounded-2xl p-4 max-w-md mx-auto flex justify-between items-center">
                <div>
                    <span class="text-xs text-indigo-200 uppercase font-semibold block">Saldo Atual</span>
                    <span id="totalBalance" class="text-2xl font-black">R$ 0,00</span>
                </div>
                <div class="text-right space-y-1">
                    <span id="totalIncome" class="text-xs text-emerald-300 font-bold block">+ R$ 0,00</span>
                    <span id="totalExpense" class="text-xs text-rose-300 font-bold block">- R$ 0,00</span>
                </div>
            </div>
        </header>

        <!-- Formulário de Lançamento -->
        <main class="max-w-md mx-auto p-4 space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Novo Lançamento</h3>
                <div class="flex gap-2">
                    <input type="text" id="descInput" placeholder="Descrição (ex: Mercado)" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500">
                    <button onclick="startVoiceRecognition()" class="bg-indigo-50 text-indigo-600 px-4 rounded-xl hover:bg-indigo-100 transition" title="Lançar por Voz">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
                <div class="flex gap-2">
                    <input type="number" id="valueInput" step="0.01" placeholder="Valor (R$)" class="w-1/2 p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500">
                    <select id="typeInput" class="w-1/2 p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500 font-semibold text-slate-600">
                        <option value="despesa">🔴 Despesa</option>
                        <option value="receita">🟢 Receita</option>
                    </select>
                </div>
                <button onclick="addTransaction()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-slate-800 transition">Adicionar</button>
            </div>

            <!-- Lista de Extrato -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Lançamentos Recentes</h3>
                <div id="transactionList" class="space-y-2">
                    <!-- Registros aparecerão aqui em tempo real -->
                </div>
            </div>
        </main>
    </div>

    <!-- Script Principal do Sistema -->
    <script>
        // Configuração do seu Firebase Realtime Database
        const firebaseConfig = { 
            databaseURL: "https://sucesso-financeiro-c3cbe-default-rtdb.firebaseio.com" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        let currentUser = null;
        let dbRef = null;

        // Monitor de Estado de Login
        auth.onAuthStateChanged(user => {
            const authScreen = document.getElementById('authScreen');
            const appScreen = document.getElementById('appScreen');
            
            if (user) {
                currentUser = user;
                document.getElementById('userEmailDisplay').innerText = user.email;
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                
                // Conecta os dados no nó privado do usuário logado
                dbRef = db.ref('users/' + user.uid + '/financeiro');
                listenToData();
            } else {
                currentUser = null;
                dbRef = null;
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // Ações de Autenticação
        function handleLogin() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            showError('');

            auth.signInWithEmailAndPassword(email, pass).catch(err => {
                showError('Erro ao entrar: Verifique e-mail e senha.');
            });
        }

        function handleSignUp() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            showError('');

            if (pass.length < 6) {
                showError('A senha deve ter pelo menos 6 caracteres.');
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass).catch(err => {
                showError('Erro ao cadastrar: ' + err.message);
            });
        }

        function handleLogout() {
            auth.signOut();
        }

        function showError(msg) {
            const errEl = document.getElementById('authError');
            if (msg) {
                errEl.innerText = msg;
                errEl.classList.remove('hidden');
            } else {
                errEl.classList.add('hidden');
            }
        }

        // Lógica do Banco de Dados
        function listenToData() {
            if (!dbRef) return;
            dbRef.on('value', snapshot => {
                const data = snapshot.val() || {};
                renderApp(data);
            });
        }

        function addTransaction() {
            const desc = document.getElementById('descInput').value.trim();
            const val = parseFloat(document.getElementById('valueInput').value);
            const type = document.getElementById('typeInput').value;

            if (!desc || isNaN(val) || val <= 0) {
                alert('Preencha a descrição e um valor válido!');
                return;
            }

            const newPostRef = dbRef.child('items').push();
            newPostRef.set({
                desc: desc,
                val: val,
                type: type,
                date: new Date().toLocaleDateString('pt-BR')
            });

            document.getElementById('descInput').value = '';
            document.getElementById('valueInput').value = '';
        }

        function deleteTransaction(key) {
            if (confirm('Deseja excluir este lançamento?')) {
                dbRef.child('items/' + key).remove();
            }
        }

        function renderApp(data) {
            const listEl = document.getElementById('transactionList');
            listEl.innerHTML = '';
            
            let totalIn = 0;
            let totalOut = 0;

            const items = data.items || {};
            const keys = Object.keys(items).reverse();

            if (keys.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-sm">Nenhum lançamento cadastrado.</div>`;
            }

            keys.forEach(key => {
                const item = items[key];
                if (item.type === 'receita') totalIn += item.val;
                if (item.type === 'despesa') totalOut += item.val;

                const isIncome = item.type === 'receita';
                const colorClass = isIncome ? 'text-emerald-600' : 'text-rose-600';
                const sign = isIncome ? '+' : '-';

                listEl.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                        <div>
                            <p class="font-bold text-slate-800 text-sm">${item.desc}</p>
                            <p class="text-xs text-slate-400">${item.date}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-extrabold text-sm ${colorClass}">${sign} R$ ${item.val.toFixed(2).replace('.', ',')}</span>
                            <button onclick="deleteTransaction('${key}')" class="text-slate-300 hover:text-rose-500 transition">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            const balance = totalIn - totalOut;
            document.getElementById('totalBalance').innerText = `R$ ${balance.toFixed(2).replace('.', ',')}`;
            document.getElementById('totalIncome').innerText = `+ R$ ${totalIn.toFixed(2).replace('.', ',')}`;
            document.getElementById('totalExpense').innerText = `- R$ ${totalOut.toFixed(2).replace('.', ',')}`;
        }

        // Reconhecimento de Voz Simples
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Reconhecimento de voz não suportado neste navegador.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.start();

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('descInput').value = text;
            };
        }
    </script>
</body>
</html>
