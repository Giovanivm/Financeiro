<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sucesso Financeiro</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            background-color: var(--bg-card);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .top-bar h1 {
            font-size: 1.1rem;
            color: var(--accent-blue);
            font-weight: 700;
        }

        .btn-reset {
            background: #ef4444;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 85px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .voice-section {
            text-align: center;
            padding: 12px;
        }

        .btn-voice {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 8px;
        }

        .btn-voice.listening {
            background: linear-gradient(135deg, #ef4444, #f87171);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-green);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .sub-tab-btn {
            padding: 6px 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .sub-tab-btn.active {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            border-color: var(--accent-blue);
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .trans-title {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
        }

        .trans-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .trans-amount {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .amount-expense { color: var(--accent-red); }
        .amount-income { color: var(--accent-green); }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary-card {
            background-color: var(--bg-card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .summary-card span {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .summary-card h3 {
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.75rem;
            cursor: pointer;
            width: 25%;
            padding: 8px 0;
        }

        .nav-item.active {
            color: var(--accent-blue);
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1.3rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Sucesso Financeiro</h1>
        <button class="btn-reset" id="btn-force-reset">LIMPAR DADOS</button>
    </div>

    <div class="content-container">

        <!-- ABA 1: DESPESAS -->
        <div id="tab-expenses" class="tab-content active">
            <div class="card voice-section">
                <button class="btn-voice" id="btn-voice-input">🎤</button>
                <div style="font-weight: 600; font-size: 0.95rem;">Lançamento por Voz</div>
                <div style="font-size: 0.8rem; color: var(--text-sub);">Fale o valor e a descrição</div>
            </div>

            <div class="card">
                <div class="card-title">➕ Nova Despesa Manual</div>
                <form id="form-exp">
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="exp-desc" class="form-control" placeholder="Ex: Mercado" required>
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" step="0.01" id="exp-amount" class="form-control" placeholder="0,00" required>
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="exp-date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Pagamento</label>
                        <select id="exp-method" class="form-control">
                            <option value="Débito/PIX">Débito / PIX</option>
                            <option value="Crédito">Cartão de Crédito</option>
                            <option value="Dinheiro">Dinheiro</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Salvar Despesa</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">📋 Despesas Recentes</div>
                <div id="expenses-feed"></div>
            </div>
        </div>

        <!-- ABA 2: RENDAS -->
        <div id="tab-incomes" class="tab-content">
            <div class="sub-tabs" id="income-subtabs">
                <button class="sub-tab-btn active" data-sub="penal">Policial Penal</button>
                <button class="sub-tab-btn" data-sub="nutri">Nutricionista</button>
                <button class="sub-tab-btn" data-sub="outras">Outras Fontes</button>
            </div>

            <div class="card">
                <div class="card-title">💰 Lançar Receita</div>
                <form id="form-inc">
                    <div class="form-group">
                        <label>Origem / Descrição</label>
                        <select id="inc-desc-select" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" step="0.01" id="inc-amount" class="form-control" placeholder="0,00" required>
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="inc-date" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-submit" style="background-color: var(--accent-blue);">Salvar Receita</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">📈 Receitas Registradas</div>
                <div id="incomes-feed"></div>
            </div>
        </div>

        <!-- ABA 3: RELATÓRIOS -->
        <div id="tab-reports" class="tab-content">
            <div class="summary-grid">
                <div class="summary-card">
                    <span>Total Receitas</span>
                    <h3 style="color: var(--accent-green);" id="rep-income">R$ 0,00</h3>
                </div>
                <div class="summary-card">
                    <span>Total Despesas</span>
                    <h3 style="color: var(--accent-red);" id="rep-expense">R$ 0,00</h3>
                </div>
            </div>

            <div class="card" style="text-align: center;">
                <span>Balanço Geral</span>
                <h2 id="rep-balance" style="font-size: 1.8rem; margin-top: 4px;">R$ 0,00</h2>
            </div>
        </div>

        <!-- ABA 4: PERFIL -->
        <div id="tab-profile" class="tab-content">
            <div class="card">
                <div class="card-title">⚙️ Perfil</div>
                <div class="form-group">
                    <label>Seu Nome</label>
                    <input type="text" id="prof-name" class="form-control" value="Giovani">
                </div>
                <button type="button" id="btn-save-prof" class="btn-submit">Salvar Perfil</button>
            </div>
        </div>

    </div>

    <!-- Navegação Inferior -->
    <nav class="nav-bar">
        <button class="nav-item active" data-tab="expenses">
            <span class="nav-icon">🎤</span>
            <span>Despesas</span>
        </button>
        <button class="nav-item" data-tab="incomes">
            <span class="nav-icon">💰</span>
            <span>Rendas</span>
        </button>
        <button class="nav-item" data-tab="reports">
            <span class="nav-icon">📊</span>
            <span>Relatórios</span>
        </button>
        <button class="nav-item" data-tab="profile">
            <span class="nav-icon">⚙️</span>
            <span>Perfil</span>
        </button>
    </nav>

    <script>
        (function() {
            // Garante a limpeza total imediatamente se houver o evento
            document.getElementById('btn-force-reset').addEventListener('click', function() {
                localStorage.clear();
                window.location.reload(true);
            });

            var state = {
                currentTab: 'expenses',
                currentSubTab: 'penal',
                items: []
            };

            var incomeOpts = {
                penal: ['Subsídio / Salário', 'AC4 / Plantão Extra', 'Indenizações', 'Adicionais'],
                nutri: ['Consulta Individual', 'Pacote Alimentar', 'Mentoria', 'Venda de Cursos/Ebooks'],
                outras: ['Renda Extra', 'Investimentos', 'Vendas Gerais', 'Serviços']
            };

            function getTodayStr() {
                var d = new Date();
                var m = (d.getMonth() + 1);
                var day = d.getDate();
                return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
            }

            function formatDate(str) {
                if (!str) return '';
                var p = str.split('-');
                return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : str;
            }

            function loadData() {
                try {
                    var data = localStorage.getItem('sf_app_data_v3');
                    if (data) state.items = JSON.parse(data) || [];
                } catch(e) {
                    state.items = [];
                }
            }

            function saveData() {
                try {
                    localStorage.setItem('sf_app_data_v3', JSON.stringify(state.items));
                } catch(e) {}
            }

            function setDates() {
                var today = getTodayStr();
                document.getElementById('exp-date').value = today;
                document.getElementById('inc-date').value = today;
            }

            function renderIncomeOptions() {
                var sel = document.getElementById('inc-desc-select');
                sel.innerHTML = '';
                var opts = incomeOpts[state.currentSubTab] || incomeOpts.outras;
                for (var i = 0; i < opts.length; i++) {
                    var opt = document.createElement('option');
                    opt.value = opts[i];
                    opt.textContent = opts[i];
                    sel.appendChild(opt);
                }
            }

            function renderFeeds() {
                var expFeed = document.getElementById('expenses-feed');
                var incFeed = document.getElementById('incomes-feed');
                expFeed.innerHTML = '';
                incFeed.innerHTML = '';

                var exps = state.items.filter(function(i){ return i.type === 'expense'; });
                var incs = state.items.filter(function(i){ return i.type === 'income'; });

                if (exps.length === 0) {
                    expFeed.innerHTML = '<div style="color:var(--text-sub); font-size:0.8rem;">Nenhuma despesa.</div>';
                } else {
                    exps.forEach(function(i) {
                        expFeed.innerHTML += '<div class="transaction-item"><div><span class="trans-title">' + i.title + '</span><span class="trans-sub">' + i.detail + ' • 📅 ' + formatDate(i.date) + '</span></div><span class="trans-amount amount-expense">- R$ ' + Number(i.amount).toFixed(2) + '</span></div>';
                    });
                }

                if (incs.length === 0) {
                    incFeed.innerHTML = '<div style="color:var(--text-sub); font-size:0.8rem;">Nenhuma receita.</div>';
                } else {
                    incs.forEach(function(i) {
                        incFeed.innerHTML += '<div class="transaction-item"><div><span class="trans-title">' + i.title + '</span><span class="trans-sub">' + i.detail + ' • 📅 ' + formatDate(i.date) + '</span></div><span class="trans-amount amount-income">+ R$ ' + Number(i.amount).toFixed(2) + '</span></div>';
                    });
                }
            }

            function renderReports() {
                var totalInc = 0;
                var totalExp = 0;

                state.items.forEach(function(i) {
                    if (i.type === 'income') totalInc += Number(i.amount);
                    if (i.type === 'expense') totalExp += Number(i.amount);
                });

                document.getElementById('rep-income').textContent = 'R$ ' + totalInc.toFixed(2);
                document.getElementById('rep-expense').textContent = 'R$ ' + totalExp.toFixed(2);
                
                var bal = totalInc - totalExp;
                var balEl = document.getElementById('rep-balance');
                balEl.textContent = 'R$ ' + bal.toFixed(2);
                balEl.style.color = bal >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
            }

            // Atribuição dos Eventos de Navegação Abaixo
            var navBtns = document.querySelectorAll('.nav-item');
            navBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var targetTab = this.getAttribute('data-tab');
                    
                    document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.remove('active'); });
                    document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });

                    this.classList.add('active');
                    document.getElementById('tab-' + targetTab).classList.add('active');

                    if (targetTab === 'reports') renderReports();
                });
            });

            // Navegação das Sub-abas de Renda
            var subBtns = document.querySelectorAll('.sub-tab-btn');
            subBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    subBtns.forEach(function(b){ b.classList.remove('active'); });
                    this.classList.add('active');
                    state.currentSubTab = this.getAttribute('data-sub');
                    renderIncomeOptions();
                });
            });

            // Submit Despesa
            document.getElementById('form-exp').addEventListener('submit', function(e) {
                e.preventDefault();
                var desc = document.getElementById('exp-desc').value.trim();
                var val = parseFloat(document.getElementById('exp-amount').value);
                var dt = document.getElementById('exp-date').value || getTodayStr();
                var mtd = document.getElementById('exp-method').value;

                if (desc && !isNaN(val)) {
                    state.items.unshift({ type: 'expense', title: desc, amount: val, detail: mtd, date: dt });
                    saveData();
                    renderFeeds();
                    document.getElementById('exp-desc').value = '';
                    document.getElementById('exp-amount').value = '';
                    setDates();
                }
            });

            // Submit Renda
            document.getElementById('form-inc').addEventListener('submit', function(e) {
                e.preventDefault();
                var desc = document.getElementById('inc-desc-select').value;
                var val = parseFloat(document.getElementById('inc-amount').value);
                var dt = document.getElementById('inc-date').value || getTodayStr();

                if (desc && !isNaN(val)) {
                    state.items.unshift({ type: 'income', title: desc, amount: val, detail: state.currentSubTab, date: dt });
                    saveData();
                    renderFeeds();
                    document.getElementById('inc-amount').value = '';
                    setDates();
                }
            });

            // Inicialização
            loadData();
            setDates();
            renderIncomeOptions();
            renderFeeds();

        })();
    </script>
</body>
</html>
