<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso Financeiro</title>
    
    <!-- Configuração PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="themeMeta" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2845/2845724.png">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDKs do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* Transição suave ao trocar de tema */
        body, header, div, input, select, button {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body id="appBody" class="bg-slate-100 font-sans min-h-screen text-slate-800 pb-20">

    <!-- Tela de Autenticação / Login -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-5 text-center">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Sucesso Financeiro</h2>
                <p class="text-xs text-slate-500 mt-1">Acesse sua conta para continuar</p>
            </div>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">E-mail</label>
                    <input type="email" id="authEmail" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">Senha</label>
                    <input type="password" id="authPassword" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
                </div>
            </div>

            <p id="authError" class="text-xs text-rose-500 hidden font-medium"></p>

            <div class="space-y-2">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg transition">Entrar</button>
                <button onclick="handleSignUp()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-sm transition">Criar Nova Conta</button>
            </div>
        </div>
    </div>

    <!-- Interface Principal do Aplicativo -->
    <div id="appScreen" class="hidden">
        <!-- Topo / Cabeçalho -->
        <header id="appHeader" class="bg-indigo-600 text-white p-5 rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center max-w-md mx-auto">
                <div>
                    <h1 class="text-lg font-bold">Finanças do Casal</h1>
                    <p id="userEmailDisplay" class="text-xs opacity-80"></p>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Seletor de Temas Visuais -->
                    <select id="themeSelector" onchange="changeTheme(this.value)" class="bg-white/20 text-white text-xs font-bold rounded-xl px-2 py-1.5 outline-none cursor-pointer border border-white/20">
                        <option value="clean" class="text-slate-800">✨ Clean</option>
                        <option value="dark" class="text-slate-800">🌙 Dark</option>
                        <option value="warm" class="text-slate-800">☕ Warm</option>
                    </select>
                    
                    <button onclick="handleLogout()" title="Sair da conta" class="w-8 h-8 bg-white/20 hover:bg-white/30 rounded-xl flex items-center justify-center transition">
                        <i class="fa-solid fa-right-from-bracket text-xs"></i>
                    </button>
                </div>
            </div>
            
            <!-- Resumo Financeiro -->
            <div id="summaryCard" class="mt-6 bg-white/10 backdrop-blur-md rounded-2xl p-4 max-w-md mx-auto flex justify-between items-center">
                <div>
                    <span class="text-xs uppercase font-semibold block opacity-80">Saldo Atual</span>
                    <span id="totalBalance" class="text-2xl font-black">R$ 0,00</span>
                </div>
                <div class="text-right space-y-1">
                    <span id="totalIncome" class="text-xs text-emerald-300 font-bold block">+ R$ 0,00</span>
                    <span id="totalExpense" class="text-xs text-rose-300 font-bold block">- R$ 0,00</span>
                </div>
            </div>
        </header>

        <!-- Formulário de Lançamento -->
        <main class="max-w-md mx-auto p-4 space-y-4">
            <div id="formCard" class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Novo Lançamento</h3>
                <div class="flex gap-2">
                    <input type="text" id="descInput" placeholder="Descrição (ex: Mercado)" class="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500">
                    <button onclick="startVoiceRecognition()" id="micBtn" class="bg-indigo-50 text-indigo-600 px-4 rounded-xl hover:bg-indigo-100 transition" title="Lançar por Voz">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
                <div class="flex gap-2">
                    <input type="number" id="valueInput" step="0.01" placeholder="Valor (R$)" class="w-1/2 p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500">
                    <select id="typeInput" class="w-1/2 p-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-indigo-500 font-semibold text-slate-600">
                        <option value="despesa">🔴 Despesa</option>
                        <option value="receita">🟢 Receita</option>
                    </select>
                </div>
                <button onclick="addTransaction()" id="addBtn" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-slate-800 transition">Adicionar</button>
            </div>

            <!-- Lista de Extrato -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Lançamentos Recentes</h3>
                <div id="transactionList" class="space-y-2">
                    <!-- Registros em tempo real -->
                </div>
            </div>
        </main>
    </div>

    <!-- Script Principal -->
    <script>
        // Firebase Config
        const firebaseConfig = { 
            databaseURL: "https://sucesso-financeiro-c3cbe-default-rtdb.firebaseio.com" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        let currentUser = null;
        let dbRef = null;
        let currentTheme = localStorage.getItem('appTheme') || 'clean';

        // Monitor de Estado de Login
        auth.onAuthStateChanged(user => {
            const authScreen = document.getElementById('authScreen');
            const appScreen = document.getElementById('appScreen');
            
            if (user) {
                currentUser = user;
                document.getElementById('userEmailDisplay').innerText = user.email;
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                
                dbRef = db.ref('users/' + user.uid + '/financeiro');
                listenToData();
                applyTheme(currentTheme);
            } else {
                currentUser = null;
                dbRef = null;
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // Gerenciamento de Temas Visuais
        function changeTheme(themeName) {
            currentTheme = themeName;
            localStorage.setItem('appTheme', themeName);
            applyTheme(themeName);
        }

        function applyTheme(theme) {
            document.getElementById('themeSelector').value = theme;
            const body = document.getElementById('appBody');
            const header = document.getElementById('appHeader');
            const formCard = document.getElementById('formCard');
            const addBtn = document.getElementById('addBtn');
            const micBtn = document.getElementById('micBtn');
            const meta = document.getElementById('themeMeta');

            if (theme === 'dark') {
                body.className = "bg-slate-950 font-sans min-h-screen text-slate-100 pb-20";
                header.className = "bg-slate-900 text-white p-5 rounded-b-3xl shadow-lg border-b border-slate-800";
                formCard.className = "bg-slate-900 p-4 rounded-2xl shadow-sm space-y-3 border border-slate-800";
                addBtn.className = "w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-emerald-500 transition";
                micBtn.className = "bg-slate-800 text-emerald-400 px-4 rounded-xl hover:bg-slate-700 transition";
                meta.content = "#0f172a";
            } else if (theme === 'warm') {
                body.className = "bg-stone-100 font-sans min-h-screen text-stone-800 pb-20";
                header.className = "bg-amber-800 text-amber-50 p-5 rounded-b-3xl shadow-lg";
                formCard.className = "bg-stone-50 p-4 rounded-2xl shadow-sm space-y-3 border border-stone-200";
                addBtn.className = "w-full bg-amber-900 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-amber-800 transition";
                micBtn.className = "bg-stone-200 text-amber-900 px-4 rounded-xl hover:bg-stone-300 transition";
                meta.content = "#92400e";
            } else { // Clean (Padrao)
                body.className = "bg-slate-100 font-sans min-h-screen text-slate-800 pb-20";
                header.className = "bg-indigo-600 text-white p-5 rounded-b-3xl shadow-lg";
                formCard.className = "bg-white p-4 rounded-2xl shadow-sm space-y-3";
                addBtn.className = "w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-slate-800 transition";
                micBtn.className = "bg-indigo-50 text-indigo-600 px-4 rounded-xl hover:bg-indigo-100 transition";
                meta.content = "#4f46e5";
            }
            
            if (currentUser && dbRef) {
                dbRef.once('value', snapshot => renderApp(snapshot.val() || {}));
            }
        }

        // Ações de Autenticação
        function handleLogin() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            showError('');

            auth.signInWithEmailAndPassword(email, pass).catch(() => {
                showError('E-mail ou senha incorretos.');
            });
        }

        function handleSignUp() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            showError('');

            if (pass.length < 6) {
                showError('A senha deve ter no mínimo 6 caracteres.');
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass).catch(err => {
                showError('Erro ao cadastrar: ' + err.message);
            });
        }

        function handleLogout() {
            auth.signOut();
        }

        function showError(msg) {
            const errEl = document.getElementById('authError');
            if (msg) {
                errEl.innerText = msg;
                errEl.classList.remove('hidden');
            } else {
                errEl.classList.add('hidden');
            }
        }

        // Banco de Dados
        function listenToData() {
            if (!dbRef) return;
            dbRef.on('value', snapshot => {
                renderApp(snapshot.val() || {});
            });
        }

        function addTransaction() {
            const desc = document.getElementById('descInput').value.trim();
            const val = parseFloat(document.getElementById('valueInput').value);
            const type = document.getElementById('typeInput').value;

            if (!desc || isNaN(val) || val <= 0) {
                alert('Informe uma descrição e um valor válido!');
                return;
            }

            dbRef.child('items').push({
                desc: desc,
                val: val,
                type: type,
                date: new Date().toLocaleDateString('pt-BR')
            });

            document.getElementById('descInput').value = '';
            document.getElementById('valueInput').value = '';
        }

        function deleteTransaction(key) {
            if (confirm('Deseja excluir este registro?')) {
                dbRef.child('items/' + key).remove();
            }
        }

        function renderApp(data) {
            const listEl = document.getElementById('transactionList');
            listEl.innerHTML = '';
            
            let totalIn = 0;
            let totalOut = 0;

            const items = data.items || {};
            const keys = Object.keys(items).reverse();

            const isDark = currentTheme === 'dark';
            const cardBg = isDark ? 'bg-slate-900 border border-slate-800' : 'bg-white';
            const textMain = isDark ? 'text-slate-100' : 'text-slate-800';
            const textSub = isDark ? 'text-slate-500' : 'text-slate-400';

            if (keys.length === 0) {
                listEl.innerHTML = `<div class="${cardBg} p-6 rounded-2xl text-center ${textSub} text-sm">Nenhum lançamento cadastrado.</div>`;
            }

            keys.forEach(key => {
                const item = items[key];
                if (item.type === 'receita') totalIn += item.val;
                if (item.type === 'despesa') totalOut += item.val;

                const isIncome = item.type === 'receita';
                const colorClass = isIncome ? 'text-emerald-500' : 'text-rose-500';
                const sign = isIncome ? '+' : '-';

                listEl.innerHTML += `
                    <div class="${cardBg} p-4 rounded-2xl shadow-sm flex justify-between items-center">
                        <div>
                            <p class="font-bold ${textMain} text-sm">${item.desc}</p>
                            <p class="text-xs ${textSub}">${item.date}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-extrabold text-sm ${colorClass}">${sign} R$ ${item.val.toFixed(2).replace('.', ',')}</span>
                            <button onclick="deleteTransaction('${key}')" class="${textSub} hover:text-rose-500 transition">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            const balance = totalIn - totalOut;
            document.getElementById('totalBalance').innerText = `R$ ${balance.toFixed(2).replace('.', ',')}`;
            document.getElementById('totalIncome').innerText = `+ R$ ${totalIn.toFixed(2).replace('.', ',')}`;
            document.getElementById('totalExpense').innerText = `- R$ ${totalOut.toFixed(2).replace('.', ',')}`;
        }

        // Voz
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Voz não suportada neste navegador.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.start();

            recognition.onresult = (event) => {
                document.getElementById('descInput').value = event.results[0][0].transcript;
            };
        }
    </script>
</body>
</html>
