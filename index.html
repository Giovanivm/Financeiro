<script>
    const firebaseConfig = { databaseURL: "https://casal-app-default-rtdb.firebaseio.com" };
    let dbRef = null;
    let pairCode = localStorage.getItem('casal_pair_code') || 'casal-demo-123';
    let selectedDate = new Date();
    let currentReceiptBase64 = null;

    try {
      firebase.initializeApp(firebaseConfig);
      dbRef = firebase.database().ref('casais/' + pairCode);
      listenToFirebase();
    } catch(e) { console.log("Modo offline."); }

    let currentTab = 'expenses';
    let state = JSON.parse(localStorage.getItem('casal_app_data')) || { 
      p1Name: "Parceiro 1", p2Name: "Parceiro 2", p1: 0, p2: 0, expenses: [], reminders: []
    };

    function listenToFirebase() {
      if (!dbRef) return;
      dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          state = val;
          if (!state.expenses) state.expenses = [];
          if (!state.reminders) state.reminders = [];
          saveToStorage(false);
          updateUI();
        }
      });
    }

    function saveToStorage(syncFirebase = true) {
      localStorage.setItem('casal_app_data', JSON.stringify(state));
      if (syncFirebase && dbRef) dbRef.set(state);
    }

    function getISODateString(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
    }

    function changeMonth(delta) {
      selectedDate.setMonth(selectedDate.getMonth() + delta);
      updateUI();
    }

    function switchTab(tab) {
      currentTab = tab;
      const expView = document.getElementById("expensesView");
      const remView = document.getElementById("remindersView");
      const btnExp = document.getElementById("tabExpensesBtn");
      const btnRem = document.getElementById("tabRemindersBtn");
      const mainAddBtn = document.getElementById("mainAddBtn");

      if (tab === 'expenses') {
        expView.classList.remove("hidden");
        remView.classList.add("hidden");
        btnExp.className = "flex-1 py-3 text-center text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 flex justify-center items-center gap-2";
        btnRem.className = "flex-1 py-3 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent flex justify-center items-center gap-2";
        mainAddBtn.innerHTML = '<i class="fa-solid fa-plus text-base"></i> Nova Despesa';
        mainAddBtn.setAttribute("onclick", "openExpenseModal()");
      } else {
        expView.classList.add("hidden");
        remView.classList.remove("hidden");
        btnRem.className = "flex-1 py-3 text-center text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 flex justify-center items-center gap-2";
        btnExp.className = "flex-1 py-3 text-center text-sm font-bold text-slate-400 border-b-2 border-transparent flex justify-center items-center gap-2";
        mainAddBtn.innerHTML = '<i class="fa-solid fa-plus text-base"></i> Novo Lembrete';
        mainAddBtn.setAttribute("onclick", "openReminderModal()");
      }
    }

    function updateUI() {
      const year = selectedDate.getFullYear();
      const month = selectedDate.getMonth();
      const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      document.getElementById("currentMonthLabel").innerText = `${monthNames[month]} de ${year}`;

      const filteredExpenses = (state.expenses || []).filter(item => {
        const d = new Date(item.date + "T00:00:00");
        return d.getFullYear() === year && d.getMonth() === month;
      });

      const filteredReminders = (state.reminders || []).filter(item => {
        const d = new Date(item.date + "T00:00:00");
        return d.getFullYear() === year && d.getMonth() === month;
      });

      const totalInc = (state.p1 || 0) + (state.p2 || 0);
      const totalExp = filteredExpenses.reduce((acc, curr) => acc + (curr.amount || 0), 0);
      const balance = totalInc - totalExp;

      document.getElementById("totalIncome").innerText = formatBRL(totalInc);
      document.getElementById("totalExpenses").innerText = formatBRL(totalExp);
      document.getElementById("netBalance").innerText = formatBRL(balance);

      document.getElementById("p1NameDisplay").innerText = state.p1Name || "Parceiro 1";
      document.getElementById("p2NameDisplay").innerText = state.p2Name || "Parceiro 2";
      document.getElementById("p1IncomeVal").innerText = formatBRL(state.p1);
      document.getElementById("p2IncomeVal").innerText = formatBRL(state.p2);

      const list = document.getElementById("transactionsList");
      if (filteredExpenses.length === 0) {
        list.innerHTML = '<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center"><p class="text-xs text-slate-400">Nenhuma despesa para este mês.</p></div>';
      } else {
        list.innerHTML = filteredExpenses.map(item => `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-sm text-slate-800 block">${escapeHtml(item.desc)}</span>
                ${item.receipt ? `<button type="button" onclick="openReceiptViewer('${item.id}')" class="text-indigo-600 hover:text-indigo-800" title="Ver Nota Fiscal"><i class="fa-solid fa-paperclip text-xs"></i></button>` : ''}
              </div>
              <div class="flex items-center gap-2 text-xs">
                <span class="font-bold text-rose-600">-${formatBRL(item.amount)}</span>
                <span class="text-slate-400">• ${formatDisplayDate(item.date)}</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="openExpenseModal('${item.id}')" class="text-slate-400 hover:text-indigo-600 p-2"><i class="fa-solid fa-pen text-xs"></i></button>
              <button type="button" onclick="deleteExpense('${item.id}')" class="text-slate-400 hover:text-rose-600 p-2"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          </div>
        `).join("");
      }

      const remList = document.getElementById("remindersList");
      if (filteredReminders.length === 0) {
        remList.innerHTML = '<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center"><p class="text-xs text-slate-400">Nenhum lembrete para este mês.</p></div>';
      } else {
        remList.innerHTML = filteredReminders.map(item => `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm ${item.done ? 'opacity-50' : ''}">
            <div class="flex items-center gap-3">
              <button type="button" onclick="toggleReminderDone('${item.id}')" class="text-lg ${item.done ? 'text-emerald-500' : 'text-slate-300'}">
                <i class="fa-solid ${item.done ? 'fa-circle-check' : 'fa-circle'}"></i>
              </button>
              <div>
                <span class="font-semibold text-sm ${item.done ? 'line-through text-slate-400' : 'text-slate-800'} block">${escapeHtml(item.text)}</span>
                <span class="text-xs text-slate-400">${formatDisplayDate(item.date)}</span>
              </div>
            </div>
            <button type="button" onclick="deleteReminder('${item.id}')" class="text-slate-400 hover:text-rose-600 p-2"><i class="fa-solid fa-trash text-xs"></i></button>
          </div>
        `).join("");
      }
    }

    function formatBRL(val) {
      return (val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    function openIncomeModal() {
      document.getElementById("inputNameP1").value = state.p1Name || "Parceiro 1";
      document.getElementById("inputNameP2").value = state.p2Name || "Parceiro 2";
      document.getElementById("inputIncomeP1").value = state.p1 || "";
      document.getElementById("inputIncomeP2").value = state.p2 || "";
      document.getElementById("incomeModal").classList.remove("hidden");
    }
    function closeIncomeModal() { document.getElementById("incomeModal").classList.add("hidden"); }

    function saveIncomeAndNames() {
      state.p1Name = document.getElementById("inputNameP1").value.trim() || "Parceiro 1";
      state.p2Name = document.getElementById("inputNameP2").value.trim() || "Parceiro 2";
      state.p1 = parseFloat(document.getElementById("inputIncomeP1").value) || 0;
      state.p2 = parseFloat(document.getElementById("inputIncomeP2").value) || 0;
      saveToStorage();
      closeIncomeModal();
      updateUI();
    }

    function openExpenseModal(id = null) {
      currentReceiptBase64 = null;
      document.getElementById("receiptPreviewContainer").classList.add("hidden");

      if (id) {
        const item = state.expenses.find(x => x.id === id);
        if (item) {
          document.getElementById("expId").value = item.id;
          document.getElementById("expDesc").value = item.desc;
          document.getElementById("expAmount").value = item.amount;
          document.getElementById("expDate").value = item.date || getISODateString();
          if (item.receipt) {
            currentReceiptBase64 = item.receipt;
            document.getElementById("receiptPreviewImg").src = item.receipt;
            document.getElementById("receiptPreviewContainer").classList.remove("hidden");
          }
        }
      } else {
        document.getElementById("expId").value = "";
        document.getElementById("expDesc").value = "";
        document.getElementById("expAmount").value = "";
        document.getElementById("expDate").value = getISODateString();
      }
      document.getElementById("expenseModal").classList.remove("hidden");
    }
    function closeExpenseModal() { document.getElementById("expenseModal").classList.add("hidden"); }

    function saveExpense() {
      const id = document.getElementById("expId").value;
      const desc = document.getElementById("expDesc").value.trim();
      const amount = parseFloat(document.getElementById("expAmount").value) || 0;
      const date = document.getElementById("expDate").value || getISODateString();

      if (!desc) return alert("Digite a descrição.");

      if (id) {
        const item = state.expenses.find(x => x.id === id);
        if (item) { 
          item.desc = desc; 
          item.amount = amount; 
          item.date = date; 
          item.receipt = currentReceiptBase64; 
        }
      } else {
        state.expenses.unshift({ id: Date.now().toString(), desc, amount, date, receipt: currentReceiptBase64 });
      }

      selectedDate = new Date(date + "T00:00:00");
      saveToStorage();
      closeExpenseModal();
      updateUI();
    }

    function removeReceipt() {
      currentReceiptBase64 = null;
      document.getElementById("receiptPreviewContainer").classList.add("hidden");
    }

    function openReceiptViewer(id) {
      const item = state.expenses.find(x => x.id === id);
      if (item && item.receipt) {
        document.getElementById("viewerTitle").innerText = item.desc;
        document.getElementById("fullReceiptImg").src = item.receipt;
        document.getElementById("downloadReceiptBtn").href = item.receipt;
        document.getElementById("receiptViewerModal").classList.remove("hidden");
      }
    }
    function closeReceiptViewer() { document.getElementById("receiptViewerModal").classList.add("hidden"); }

    function deleteExpense(id) {
      if (confirm("Apagar esta despesa?")) {
        state.expenses = state.expenses.filter(x => x.id !== id);
        saveToStorage();
        updateUI();
      }
    }

    // --- GERENCIAMENTO DE CÂMERA E MÚLTIPLOS MODOS DE CAPTURA ---
    let cameraStream = null;
    let currentCamMode = 'single';
    let capturedImagesList = [];

    function openCameraModal() {
      document.getElementById("cameraModal").classList.remove("hidden");
      capturedImagesList = [];
      setCamMode('single');
      startCameraStream();
    }

    function closeCameraModal() {
      stopCameraStream();
      document.getElementById("cameraModal").classList.add("hidden");
    }

    function startCameraStream() {
      const video = document.getElementById("cameraVideo");
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
          .then(stream => {
            cameraStream = stream;
            video.srcObject = stream;
          })
          .catch(err => {
            console.log("Câmera direta indisponível. Utilize a opção de Galeria/Arquivo.");
          });
      }
    }

    function stopCameraStream() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function setCamMode(mode) {
      currentCamMode = mode;
      const modes = ['single', 'multi', 'pano', 'qr'];
      modes.forEach(m => {
        const btn = document.getElementById(`mode${m.charAt(0).toUpperCase() + m.slice(1)}Btn`);
        if (m === mode) {
          btn.className = "py-1 px-3 rounded-lg bg-indigo-600 text-white font-bold";
        } else {
          btn.className = "py-1 px-3 rounded-lg hover:bg-slate-700 text-slate-300 font-bold";
        }
      });

      const qrOverlay = document.getElementById("qrOverlay");
      const multiCounter = document.getElementById("multiCounter");
      const finishBtn = document.getElementById("finishMultiBtn");
      const instruction = document.getElementById("instructionText");

      qrOverlay.classList.add("hidden");
      multiCounter.classList.add("hidden");
      finishBtn.classList.add("opacity-50", "pointer-events-none");

      if (mode === 'single') {
        instruction.innerText = "Tire 1 foto do comprovante completo.";
      } else if (mode === 'multi') {
        instruction.innerText = "Tire fotos sequenciais (topo, meio e fim). Clique em Concluir para juntar.";
        multiCounter.classList.remove("hidden");
        document.getElementById("capturedCount").innerText = capturedImagesList.length;
        if (capturedImagesList.length > 0) {
          finishBtn.classList.remove("opacity-50", "pointer-events-none");
        }
      } else if (mode === 'pano') {
        instruction.innerText = "Modo Panorâmico: Enquadre a nota de ponta a ponta e clique para capturar.";
      } else if (mode === 'qr') {
        instruction.innerText = "Aponte a câmera diretamente para o QR Code do cupom fiscal.";
        qrOverlay.classList.remove("hidden");
      }
    }

    function captureCurrentMode() {
      const video = document.getElementById("cameraVideo");
      const canvas = document.getElementById("photoCanvas");
      
      if (!video.videoWidth) {
        triggerNativeCamera();
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Img = canvas.toDataURL('image/jpeg', 0.85);

      if (currentCamMode === 'single' || currentCamMode === 'pano' || currentCamMode === 'qr') {
        currentReceiptBase64 = base64Img;
        document.getElementById("receiptPreviewImg").src = base64Img;
        document.getElementById("receiptPreviewContainer").classList.remove("hidden");
        closeCameraModal();
      } else if (currentCamMode === 'multi') {
        capturedImagesList.push(base64Img);
        document.getElementById("capturedCount").innerText = capturedImagesList.length;
        const finishBtn = document.getElementById("finishMultiBtn");
        finishBtn.classList.remove("opacity-50", "pointer-events-none");
      }
    }

    function finishMultiCapture() {
      if (capturedImagesList.length === 0) return;

      const loadedImgs = [];
      let loadedCount = 0;

      capturedImagesList.forEach((src, index) => {
        const img = new Image();
        img.onload = () => {
          loadedImgs[index] = img;
          loadedCount++;
          if (loadedCount === capturedImagesList.length) {
            stitchVerticalImages(loadedImgs);
          }
        };
        img.src = src;
      });
    }

    function stitchVerticalImages(images) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const targetWidth = images[0].width;
      let totalHeight = 0;

      images.forEach(img => {
        const scale = targetWidth / img.width;
        totalHeight += img.height * scale;
      });

      canvas.width = targetWidth;
      canvas.height = totalHeight;

      let currentY = 0;
      images.forEach(img => {
        const scale = targetWidth / img.width;
        const drawHeight = img.height * scale;
        ctx.drawImage(img, 0, currentY, targetWidth, drawHeight);
        currentY += drawHeight;
      });

      const stitchedBase64 = canvas.toDataURL('image/jpeg', 0.85);
      currentReceiptBase64 = stitchedBase64;
      document.getElementById("receiptPreviewImg").src = stitchedBase64;
      document.getElementById("receiptPreviewContainer").classList.remove("hidden");
      closeCameraModal();
    }

    function triggerNativeCamera() {
      document.getElementById("fallbackFileInput").click();
    }

    function handleFileFallback(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentReceiptBase64 = e.target.result;
        document.getElementById("receiptPreviewImg").src = currentReceiptBase64;
        document.getElementById("receiptPreviewContainer").classList.remove("hidden");
        closeCameraModal();
      };
      reader.readAsDataURL(file);
    }

    // --- RECONHECIMENTO DE VOZ COMPATÍVEL COM CELULAR ---
    let recognition = null;
    let isListening = false;

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.lang = 'pt-BR';
      rec.continuous = false;
      rec.interimResults = false;

      rec.onstart = function() {
        isListening = true;
        document.getElementById("voiceBtn").classList.add("mic-recording");
      };

      rec.onend = function() {
        isListening = false;
        document.getElementById("voiceBtn").classList.remove("mic-recording");
      };

      rec.onerror = function(event) {
        isListening = false;
        document.getElementById("voiceBtn").classList.remove("mic-recording");
      };

      rec.onresult = function(event) {
        const transcript = event.results[0][0].transcript.toLowerCase();
        parseVoiceCommand(transcript);
      };

      return rec;
    }

    function toggleVoiceRecognition() {
      if (!recognition) recognition = initSpeechRecognition();
      if (!recognition) return alert("Navegador sem suporte a comando por voz ou sem conexão HTTPS.");

      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch(err) { recognition.stop(); setTimeout(() => { recognition.start(); }, 200); }
      }
    }

    function extractDateFromSpeech(text) {
      const months = {
        'janeiro': '01', 'fevereiro': '02', 'março': '03', 'marco': '03', 'abril': '04',
        'maio': '05', 'junho': '06', 'julho': '07', 'agosto': '08', 'setembro': '09',
        'outubro': '10', 'novembro': '11', 'dezembro': '12'
      };

      let detectedDate = getISODateString();
      let cleanText = text;

      const numDateMatch = text.match(/dia\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i);
      if (numDateMatch) {
        let day = numDateMatch[1].padStart(2, '0');
        let month = numDateMatch[2].padStart(2, '0');
        let year = numDateMatch[3] ? (numDateMatch[3].length === 2 ? '20' + numDateMatch[3] : numDateMatch[3]) : new Date().getFullYear();
        detectedDate = `${year}-${month}-${day}`;
        cleanText = text.replace(numDateMatch[0], '').trim();
        return { date: detectedDate, text: cleanText };
      }

      const textDateMatch = text.match(/(?:dia\s+)?(\d{1,2})\s+de\s+([a-z]+)(?:\s+de\s+(\d{4}))?/i);
      if (textDateMatch) {
        let day = textDateMatch[1].padStart(2, '0');
        let monthName = textDateMatch[2].toLowerCase();
        let year = textDateMatch[3] || new Date().getFullYear();

        if (months[monthName]) {
          detectedDate = `${year}-${months[monthName]}-${day}`;
          cleanText = text.replace(textDateMatch[0], '').trim();
          return { date: detectedDate, text: cleanText };
        }
      }

      return { date: detectedDate, text: cleanText };
    }

    function extractAmountFromSpeech(text) {
      const thousandMatch = text.match(/(\d+(?:[.,]\d+)?)\s*mil\b/i);
      if (thousandMatch) {
        let baseNum = parseFloat(thousandMatch[1].replace(',', '.'));
        if (!isNaN(baseNum)) return { amount: baseNum * 1000, matchedText: thousandMatch[0] };
      }

      const standardMatch = text.match(/(\d+(?:[.,]\d+)?)/);
      if (standardMatch) {
        let num = parseFloat(standardMatch[1].replace(',', '.'));
        if (!isNaN(num)) return { amount: num, matchedText: standardMatch[0] };
      }

      return null;
    }

    function parseVoiceCommand(text) {
      const isReminderCommand = /^(lembra\s+de|lembrar\s+de|lembrar|lembrete)\s+/i.test(text);

      if (isReminderCommand || currentTab === 'reminders') {
        let rawText = text.replace(/^(lembra\s+de|lembrar\s+de|lembrar|lembrete)\s+/i, '').trim();
        const extracted = extractDateFromSpeech(rawText);
        let reminderText = extracted.text.charAt(0).toUpperCase() + extracted.text.slice(1);
        
        if (!state.reminders) state.reminders = [];
        state.reminders.unshift({ id: Date.now().toString(), text: reminderText, done: false, date: extracted.date });
        selectedDate = new Date(extracted.date + "T00:00:00");
        saveToStorage();
        updateUI();
        switchTab('reminders');
        return;
      }

      const parsedAmount = extractAmountFromSpeech(text);
      if (parsedAmount) {
        let amount = parsedAmount.amount;
        let cleanText = text.replace(/^(adicionar|lançar|nova despesa|cadastrar)\s+/i, '').trim();
        const parts = cleanText.split(parsedAmount.matchedText);
        let rawDesc = parts[0] ? parts[0].replace(/\b(de|reais|real)\b/g, '').trim() : '';
        let extraText = parts[1] || '';

        const extractedDate = extractDateFromSpeech(extraText.length > 0 ? extraText : rawDesc);
        if (!rawDesc && parts[1]) rawDesc = extractedDate.text;
        if (!rawDesc) rawDesc = "Despesa Diversa";

        let desc = rawDesc.charAt(0).toUpperCase() + rawDesc.slice(1);

        state.expenses.unshift({ id: Date.now().toString(), desc, amount, date: extractedDate.date });
        selectedDate = new Date(extractedDate.date + "T00:00:00");
        saveToStorage();
        updateUI();
        switchTab('expenses');
        return;
      }

      alert(`Não foi possível processar.\n• Para despesa: "Aluguel 15 mil reais"\n• Para lembrete: "Lembra de pagar a luz dia 15"\n\n(Ouvi: "${text}")`);
    }

    function openReminderModal() {
      document.getElementById("remText").value = "";
      document.getElementById("remDate").value = getISODateString();
      document.getElementById("reminderModal").classList.remove("hidden");
    }
    function closeReminderModal() { document.getElementById("reminderModal").classList.add("hidden"); }

    function saveReminder() {
      const text = document.getElementById("remText").value.trim();
      const date = document.getElementById("remDate").value || getISODateString();
      if (!text) return alert("Digite o lembrete.");
      if (!state.reminders) state.reminders = [];
      
      state.reminders.unshift({ id: Date.now().toString(), text, done: false, date });
      selectedDate = new Date(date + "T00:00:00");
      saveToStorage();
      closeReminderModal();
      updateUI();
    }

    function toggleReminderDone(id) {
      const item = state.reminders.find(x => x.id === id);
      if (item) { item.done = !item.done; saveToStorage(); updateUI(); }
    }

    function deleteReminder(id) {
      state.reminders = state.reminders.filter(x => x.id !== id);
      saveToStorage();
      updateUI();
    }

    function openConfigModal() {
      document.getElementById("pairCodeInput").value = pairCode;
      document.getElementById("configModal").classList.remove("hidden");
    }
    function closeConfigModal() { document.getElementById("configModal").classList.add("hidden"); }

    function savePairCode() {
      const code = document.getElementById("pairCodeInput").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
      if (code) {
        pairCode = code;
        localStorage.setItem('casal_pair_code', pairCode);
        if (firebase.apps.length) {
          if (dbRef) dbRef.off();
          dbRef = firebase.database().ref('casais/' + pairCode);
          listenToFirebase();
        }
        closeConfigModal();
        alert("Sincronização atualizada para: " + pairCode);
      }
    }

    updateUI();
  </script>
